name: 🚀 Déploiement automatique MSS-DMS

on:
  push:
    branches: [ main ]

concurrency:
  group: mss-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Récupérer le code
        uses: actions/checkout@v4

      - name: 🔗 Se connecter au VPS et déployer
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            cd /var/www/vhosts/belej-erp.com/mss.belej-erp.com/

            # Conserver la configuration propre au VPS, sans afficher ses secrets.
            db_backup_dir=''
            restore_database_config() {
              if [ -n "$db_backup_dir" ]; then
                cp -p "$db_backup_dir/database.php" config/database.php || return 1
                cmp -s "$db_backup_dir/database.php" config/database.php || return 1
                rm "$db_backup_dir/database.php" || return 1
                rmdir "$db_backup_dir" || return 1
                db_backup_dir=''
              fi
            }
            trap 'restore_database_config || exit 1' EXIT
            trap 'exit 1' HUP INT TERM

            # Une modification indexée nécessite une intervention explicite.
            git diff --cached --exit-code --quiet -- config/database.php
            if ! git diff --exit-code --quiet -- config/database.php; then
              test -f config/database.php
              backup_candidate=$(mktemp -d /tmp/mss-db-config.XXXXXX)
              cp -p config/database.php "$backup_candidate/database.php"
              cmp -s config/database.php "$backup_candidate/database.php"
              db_backup_dir=$backup_candidate
              git checkout -- config/database.php
              echo "Configuration du VPS sauvegardée pour la mise à jour."
            fi

            git pull --ff-only origin main
            restore_database_config
            git log -1 --format='%h %s'

            # Vérifier que les routes mobiles sont présentes dans le code déployé.
            php scripts/test_mobile_api.php

            # Appliquer systématiquement les migrations versionnées après le code.
            php scripts/migrate.php

            # Correction des permissions
            sudo chown -R www-data:www-data .
            sudo find . -type d -exec chmod 755 {} \;
            sudo find . -type f -exec chmod 644 {} \;

            echo "Code et migrations appliqués ; vérification HTTP à suivre."

      - name: Vérifier l’API mobile en ligne
        run: |
          python3 - <<'PY'
          import json
          import urllib.error
          import urllib.request

          base = 'https://mss.belej-erp.com'
          checks = [
              ('/api/health', 200, lambda data: data.get('database') == 'ok'),
              ('/api/mobile/bootstrap', 200, lambda data: isinstance(data.get('csrf_token'), str) and len(data['csrf_token']) == 64),
              ('/api/mobile/me', 401, lambda data: data.get('success') is False and bool(data.get('message'))),
          ]
          for path, expected_status, validate in checks:
              request = urllib.request.Request(base + path, headers={'Accept': 'application/json', 'Cache-Control': 'no-cache'})
              try:
                  response = urllib.request.urlopen(request, timeout=30)
              except urllib.error.HTTPError as error:
                  response = error
              with response:
                  if response.status != expected_status or response.headers.get_content_type() != 'application/json':
                      raise SystemExit(f'Échec {path} : HTTP {response.status}, type {response.headers.get_content_type()}')
                  if not validate(json.load(response)):
                      raise SystemExit(f'Échec {path} : réponse JSON inattendue')
              print(f'OK {path} : HTTP {expected_status}')
          print('Déploiement vérifié : site, base et routes mobiles disponibles.')
          PY
